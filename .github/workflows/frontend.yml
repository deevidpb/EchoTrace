name: Frontend

on:
  push:
    paths:
      - "spa/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "spa/**"

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - run: npm ci
      - run: npm run build