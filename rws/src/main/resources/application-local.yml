server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: Lax



logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %msg%n"